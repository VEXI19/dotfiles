# File with settings that don't fit any other settings file, but are also not critical enough to require separate file

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = pl
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    kb_options = caps:escape

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
suppress-maximize = suppress-maximize-events match:class = .*

# Fix some dragging issues with XWayland
no_focus = fix-xwayland-drags match:class = $ match:title = $ match:xwayland = true match:float = true match:fullscreen = false match:pin = false

# Compact calculator, styled to match the Wofi launcher.
windowrule {
    name = qalculate
    match:class = ^qalculate-gtk$
    float = true
    center = true
    size = 540 620
    rounding = 13
    border_size = 1
}

# A compact, focused settings popup opened with Super+P.
windowrule {
    name = display-control
    match:title = ^Display & Idle$
    float = true
    center = true
    size = 920 680
    rounding = 13
    border_size = 1
}

# Persistent clock tools and their focused alert popup.
windowrule {
    name = clock
    match:title = ^Clock$
    float = true
    center = true
    size = 720 680
    rounding = 13
    border_size = 1
}

windowrule {
    name = clock-alert
    match:title = ^Clock Alert$
    float = true
    center = true
    pin = true
    size = 440 230
    rounding = 13
    border_size = 1
}

misc {
    animate_mouse_windowdragging = true
}
