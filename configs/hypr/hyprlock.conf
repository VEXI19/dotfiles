$accent = #eeeeee
$accentAlpha = #eeeeee
$font = JetBrainsMono Nerd Font
$base = #eeeeee
$error = rbg(255, 0, 0)
$warning = rgb(255, 128, 0)

# GENERAL
general {
  hide_cursor = true
}

# BACKGROUND
background {
  monitor =
  path = ~/.config/hypr/wallpapers/current
  blur_passes = 3
  color = $base
}

# TIME
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 90
  font_family = $font
  position = 0, 0
  halign = center
  valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $text
  font_size = 25
  font_family = $font
  position = 0, -80
  halign = center
  valign = center
}

# FAILED ATTEMPTS
label {
  monitor =
  text = Failed attempts: $ATTEMPTS
  color = rgba(255, 255, 255, 0.6)
  font_size = 14
  font_family = $font
  position = 0, 10
  halign = center
  valign = bottom
}
# FINGERPRINT
{
  monitor = "";
  text = "$FPRINTPROMPT";
  color = "$text";
  font_size = 14;
  font_family = $font;
  position = "0, -107";
  halign = "center";
  valign = "center";
}

# INPUT FIELD
input-field {
  monitor =
  size = 250, 45
  outline_thickness = 4
  dots_size = 0.3
  dots_spacing = 0.3
  dots_center = true
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  fade_on_empty = true
  # placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
  placeholder_text = 
  hide_input = false
  check_color = $accent
  fail_color = $error
  fail_text = $FAIL ($ATTEMPTS)
  capslock_color = $warning
  position = 0, 50
  halign = center
  valign = bottom
}
